server {
    listen 80;
    root /usr/share/nginx/html;

    # API, Swagger UI and OpenAPI docs are served by the Spring Boot container
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        # $http_host keeps the port (localhost:3000), so Spring sees the browser's Origin as same-site
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # LLM answers and the first data sync can take a while
    }

    # single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
