spring.application.name=cricket-analytics

# Optional local secrets (LLM_API_KEY etc.) from the repo-root .env file - never committed
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# --- Database (PostgreSQL via docker compose; override with env vars) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cricket?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}

# Tables are created from schema.sql (also used as LLM context), not by Hibernate
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- AI chat queries: optional separate read-only database user (see docker/postgres) ---
app.chat.db.url=${CHAT_DB_URL:${spring.datasource.url}}
app.chat.db.username=${CHAT_DB_USERNAME:}
app.chat.db.password=${CHAT_DB_PASSWORD:}

# --- LLM (any OpenAI-compatible API). Default: Groq (free tier) ---
# OpenAI:  LLM_BASE_URL=https://api.openai.com/v1   LLM_MODEL=gpt-4o-mini
# Ollama:  LLM_BASE_URL=http://localhost:11434/v1   LLM_MODEL=qwen2.5-coder:3b   (no key needed)
app.llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:openai/gpt-oss-120b}

# --- Cricsheet sync: daily download of new matches (also POST /api/admin/sync) ---
# datasets are Cricsheet download names, e.g. ipl, t20s, odis, bbl, psl (see cricsheet.org/downloads)
app.sync.enabled=${SYNC_ENABLED:false}
app.sync.cron=${SYNC_CRON:0 0 4 * * *}
app.sync.datasets=${SYNC_DATASETS:ipl}
app.sync.base-url=https://cricsheet.org/downloads

# --- Fixtures from CricketData.org (free key: cricketdata.org; put CRICKETDATA_API_KEY in .env) ---
# Uses 2 API calls per refresh (series search + series fixtures); free plan allows 100 per day.
app.fixtures.api-key=${CRICKETDATA_API_KEY:}
app.fixtures.base-url=https://api.cricapi.com/v1
app.fixtures.series=${FIXTURES_SERIES:Indian Premier League}
app.fixtures.cron=${FIXTURES_CRON:0 30 4 * * *}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
