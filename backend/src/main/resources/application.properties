spring.application.name=cricket-analytics

# Optional local secrets (LLM_API_KEY etc.) from the repo-root .env file - never committed
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# --- Database (PostgreSQL via docker compose; override with env vars) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cricket}
spring.datasource.username=${DB_USERNAME:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}

# Tables are created from schema.sql (also used as LLM context), not by Hibernate
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- LLM (any OpenAI-compatible API). Default: Groq's free Llama 3 endpoint ---
# OpenAI:  LLM_BASE_URL=https://api.openai.com/v1   LLM_MODEL=gpt-4o-mini
# Ollama:  LLM_BASE_URL=http://localhost:11434/v1   LLM_MODEL=llama3.1   (no key needed)
app.llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:llama-3.3-70b-versatile}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
