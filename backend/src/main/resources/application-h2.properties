# In-memory database for running without Docker/PostgreSQL:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Data is lost on restart. H2 console: http://localhost:8080/h2-console  (JDBC URL below, user sa, no password)
spring.datasource.url=jdbc:h2:mem:cricket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
